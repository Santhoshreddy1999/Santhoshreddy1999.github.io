name: Bug report
description: Report a reproducible portfolio defect
title: "fix: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a defect. Do not include credentials, private data, or unannounced security findings.
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-flight checks
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: This is not a private security report.
          required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest reliable sequence of steps.
      placeholder: |
        1. Open …
        2. Select …
        3. Observe …
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Affected URL or section
      placeholder: https://santhoshreddy1999.github.io/#architecture
  - type: input
    id: environment
    attributes:
      label: Browser and operating system
      placeholder: Firefox 135 on Windows 11
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add screenshots, reduced-motion settings, viewport size, or console output if useful.
