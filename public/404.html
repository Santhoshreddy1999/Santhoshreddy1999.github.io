<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0a0d0f" />
    <title>Page not found | Santhosh</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        background: #0a0d0f;
        color: #f4f2eb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background-image:
          linear-gradient(#1b2325 1px, transparent 1px),
          linear-gradient(90deg, #1b2325 1px, transparent 1px);
        background-size: 48px 48px;
      }

      main {
        width: min(680px, 100%);
        padding: clamp(32px, 8vw, 72px);
        border: 1px solid #2c3739;
        border-radius: 24px;
        background: #0d1214;
        box-shadow: 0 24px 80px rgb(0 0 0 / 35%);
      }

      p {
        max-width: 52ch;
        color: #aab4b1;
        line-height: 1.7;
      }

      .code {
        color: #65e6b4;
        font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
        font-size: 0.8rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 {
        margin: 18px 0;
        font-size: clamp(2.4rem, 8vw, 5rem);
        line-height: 0.95;
        letter-spacing: -0.05em;
      }

      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 32px;
      }

      a {
        display: inline-flex;
        min-height: 44px;
        align-items: center;
        padding: 0 18px;
        border: 1px solid #344143;
        border-radius: 999px;
        color: #f4f2eb;
        text-decoration: none;
      }

      a:first-child {
        border-color: #65e6b4;
        background: #65e6b4;
        color: #07110e;
        font-weight: 700;
      }

      a:focus-visible {
        outline: 3px solid #8ea7ff;
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="code">Error 404 · route not found</div>
      <h1>This path ends here.</h1>
      <p>
        The portfolio is still available at the root. Return to the evidence, architecture,
        and delivery roadmap—or inspect the verified source on GitHub.
      </p>
      <nav aria-label="Recovery links">
        <a href="/">Return home</a>
        <a href="https://github.com/Santhoshreddy1999">GitHub profile</a>
      </nav>
